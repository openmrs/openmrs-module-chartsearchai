version: "3.8"

services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-nightly-chartsearch}
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-nightly-chartsearch}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_DEFAULT_LOCALE:

  # Heals volumes whose contents were created as root by pre-Apr-27 backend images,
  # so the post-Apr-27 backend (running as uid 1001) can write to /openmrs/data.
  # Idempotent — already-correct volumes are unaffected.
  init-openmrs-data:
    image: alpine:3
    user: root
    volumes:
      - openmrs-data:/openmrs/data
    command: ["chown", "-R", "1001:1001", "/openmrs/data"]
    restart: "no"

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-nightly-chartsearch}
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      init-openmrs-data:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    # OpenMRS-fully-started, not Tomcat-reachability. /openmrs/health/started
    # returns 503 until Listener.isOpenmrsStarted() flips and 200 after, which
    # is the question worth asking. This used to probe /openmrs/ instead,
    # because health/started can take 10-30 min on first boot and overruns the
    # deploy script's poll window -- but that poll is disabled anyway
    # (deploy.yml passes --no-health-check), and probing /openmrs/ meant the
    # check was PASSED BY the 302 to /openmrs/initialsetup, i.e. by an instance
    # sitting in the installation wizard. That is exactly how a wiped-volume
    # deploy stayed green while serving a setup screen; backend-init.sh now
    # keeps that state from arising, and this stops rewarding it if it does.
    #
    # start_period covers a genuine first boot: with runtime properties present
    # OpenMRS starts synchronously at context init, so nothing answers until the
    # 5,284-patient seed has been brought up to the current schema. Failures
    # inside the window do not count toward retries, and a success ends it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://localhost:8080/openmrs/health/started"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m
    volumes:
      - openmrs-data:/openmrs/data

  db:
    image: mariadb:10.11
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mariadb", "--user=${OMRS_DB_USER:-openmrs}", "--password=${OMRS_DB_PASSWORD:-openmrs}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
