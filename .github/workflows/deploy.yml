name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Fully resets the ChartSearchAI instance'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'openmrs' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    environment:
      name: chartsearchai
      url: https://chartsearchai.openmrs.org/openmrs/spa
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Before the deploy so a failure here cannot leave production changed with the gate never
      # run — and `continue-on-error` because the value is only a printed NOTE (see EXPECTED_SHA
      # in the script for why a branch tip cannot be a hard expectation). Without that, an API
      # blip or a token-scope change would block the deploy to compute something the gate is
      # forbidden to fail on. The script treats an empty value as "skip the note".
      - name: Resolve the ESM commit that should be live
        id: esm
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(gh api repos/openmrs/openmrs-esm-chartsearchai/commits/main --jq .sha)"
          [ -n "$sha" ] || { echo "could not resolve openmrs-esm-chartsearchai main sha" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "expecting ESM commit $sha"

      - name: Deploy via scoped SSH
        env:
          DEPLOY_COMMAND: ${{ inputs.reset && 'deploy emr-3-ai --destroy-volumes --no-health-check' || 'deploy emr-3-ai --no-health-check' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_HOST }} \
            "$DEPLOY_COMMAND"

      # The wrapper's exit code says the compose project was acted on, not that
      # a clinician can see the feature. #275 asked for a post-deploy gate for
      # that reason; this is the narrowest one that would have caught a real
      # outage. On 2026-08-25 the deploy was green, the backend module was
      # loaded and healthy (drugreferencestatus reported 2283 entries), and the
      # AI icon was absent from every patient chart because a stale
      # pre-compressed importmap in the frontend image (importmap.json.br, the
      # variant a browser is served) shadowed the assembled one. Nothing in
      # this workflow could have said so.
      #
      # It reads only files nginx serves statically, so it does not wait on
      # OpenMRS's own startup — which is why --no-health-check above stays as it
      # is rather than being traded for a gate that can time out on a legitimate
      # first boot.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # xvfb-run because the browser must be HEADED: measured 2026-08-25, a
      # headless Chromium never clears Cloudflare's managed challenge (the page
      # stays on the interstitial and an in-page fetch throws), while a headed
      # one read the importmap at t+10s. The script's header records the rest.
      # The gate's own predicates, before they are trusted against production. Runs in about a
      # second and needs no browser: it imports the gate with GATE_SELFTEST set and drives the
      # real functions over fabricated inputs, including the 2026-09-15 defect's own timestamps.
      - name: Self-test the gate's logic
        run: node .github/scripts/assert-spa-serves-chartsearchai.test.mjs

      - name: Assert the deployed SPA loads the Chart Search AI ESM
        env:
          ESM_EXPECTED_SHA: ${{ steps.esm.outputs.sha }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npm install --no-save playwright@1.59.1
          npx playwright install --with-deps chromium
          xvfb-run -a node .github/scripts/assert-spa-serves-chartsearchai.mjs \
            "https://chartsearchai.openmrs.org"
